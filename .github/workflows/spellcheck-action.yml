name: Spellcheck Action
on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Spellcheck
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
    - uses: actions/checkout@master
    - uses: rojopolis/spellcheck-github-actions@58bd6665414e77e1d08688ff54323e01b9b434e5 # 0.29.0
      name: Spellcheck
      with:
        task_name: Markdown
        config_path: config/.spellcheck.yml
