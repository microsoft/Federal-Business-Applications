name: Spellcheck Action
on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Spellcheck
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
    - uses: actions/checkout@master
    - uses: rojopolis/spellcheck-github-actions@dad57fc333130f4c9ae9632a6ad7ddc4de3515a2 # 0.69.0
      name: Spellcheck
      with:
        task_name: Markdown
        config_path: config/.spellcheck.yml
